name: Deploy TerraTwin to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: starter_app/package-lock.json

      - name: Install dependencies
        run: npm --prefix starter_app ci

      - name: Build production application
        env:
          GITHUB_PAGES: 'true'
          VITE_BASE: '/TerraTwin/'
        run: npm --prefix starter_app run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./starter_app/dist
